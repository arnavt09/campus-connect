<div class="container">
  <h2>CampusConnect Register</h2>

  <form (ngSubmit)="register()">
    <div>
      <label>Name</label><br />
      <input
        type="text"
        [(ngModel)]="name"
        name="name"
        required
     />
   </div>

   <br />

   <div>
     <label>Email</label><br />
     <input
       type="email"
       [(ngModel)]="email"
       name="email"
       required
     />   
   </div>

   <br />

   <div>
    <label>Password</label><br />
    <input
      type="password"
      [(ngModel)]="password"
      name="password"
      required
     />
   </div>
